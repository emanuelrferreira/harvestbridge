syntax = "proto3";

package farmer;

service FarmerService {
  // Unary
  rpc RegisterFarmer (FarmerRequest) returns (FarmerResponse) {}
  rpc AddProduce (ProduceRequest) returns (ProduceResponse) {}
  rpc ListProduce (FarmerRequest) returns (ProduceListResponse) {}

  // Client-side streaming: send multiple produce items at once
  rpc AddMultipleProduce (stream ProduceRequest) returns (ProduceResponse) {}
}

message FarmerRequest {
  string farmer_id = 1;
  string name = 2;
  string location = 3;
}

message FarmerResponse {
  bool success = 1;
  string message = 2;
  string farmer_id = 3;
}

message ProduceRequest {
  string farmer_id = 1;
  string produce_name = 2;
  uint32 quantity = 3;
  string unit = 4;
  string available_date = 5;
}

message ProduceResponse {
  bool success = 1;
  string message = 2;
  uint32 items_added = 3;
}

message ProduceItem {
  string produce_name = 1;
  uint32 quantity = 2;
  string unit = 3;
  string available_date = 4;
}

message ProduceListResponse {
  bool success = 1;
  string farmer_name = 2;
  repeated ProduceItem items = 3;
}
